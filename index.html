<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Ernal Karce — EK Digital Studio</title>
    <meta name="description" content="Web design and development studio of Ernal Karce. Websites, booking systems and custom web applications built with care." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EK Digital Studio" />
    <meta property="og:title" content="Ernal Karce — EK Digital Studio" />
    <meta property="og:description" content="Web design and development studio of Ernal Karce." />
    <!-- __SITE_URL__ is replaced at build time with VITE_SITE_URL (see vite.config.ts). -->
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <!-- Self-hosted fonts: preload the two visible above the fold. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies the saved theme before first paint (external file, so the CSP needs no inline scripts). -->
    <script src="/theme-init.js"></script>
    <!-- Startup splash: visible from the first paint until React renders (src/lib/brand.ts hides it). -->
    <style>
      #ek-splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0d12; pointer-events: none; transition: opacity .35s ease, visibility .35s; }
      [data-theme='light'] #ek-splash { background: #f6f7f9; }
      #ek-splash[data-state='out'] { opacity: 0; visibility: hidden; }
      #ek-splash .ek-s-wrap { position: relative; display: grid; place-items: center; }
      #ek-splash .ek-s-glow { position: absolute; width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(closest-side, #4388ff, transparent); filter: blur(18px); opacity: .5; animation: ek-s-glow 2.6s ease-in-out infinite; }
      #ek-splash .ek-s-logo { position: relative; width: 144px; height: 96px; background-position: center; background-size: contain; background-repeat: no-repeat; animation: ek-s-in .7s cubic-bezier(.16,1,.3,1) both, ek-s-breathe 2.6s ease-in-out .7s infinite; }
      #ek-splash .ek-s-mono { position: relative; display: none; width: 64px; height: 64px; align-items: center; justify-content: center; border: 1px solid rgb(255 255 255 / .14); border-radius: 16px; background: #141923; color: #e8ebf0; font: 500 18px/1 ui-monospace, Menlo, monospace; animation: ek-s-in .7s cubic-bezier(.16,1,.3,1) both; }
      [data-theme='light'] #ek-splash .ek-s-logo { filter: drop-shadow(0 1px 1.5px rgb(15 23 42 / .28)); }
      [data-theme='light'] #ek-splash .ek-s-mono { background: #fff; color: #0b0d12; border-color: rgb(11 13 18 / .12); }
      #ek-splash .ek-s-mono b { color: #4388ff; font-weight: 500; }
      html:not(.ek-has-logo) #ek-splash .ek-s-logo { display: none; }
      html:not(.ek-has-logo) #ek-splash .ek-s-mono { display: flex; }
      #ek-splash .ek-s-track { position: relative; margin-top: 28px; width: 112px; height: 2px; overflow: hidden; border-radius: 2px; background: rgb(127 127 127 / .16); }
      #ek-splash .ek-s-track span { position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, transparent, #4388ff, transparent); animation: ek-s-sweep 1.4s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes ek-s-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
      @keyframes ek-s-breathe { 50% { transform: scale(1.035); } }
      @keyframes ek-s-glow { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .7; transform: scale(1.04); } }
      @keyframes ek-s-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #ek-splash * { animation: none !important; } #ek-splash .ek-s-track span { transform: translateX(75%); } }
    </style>
  </head>
  <body>
    <div id="ek-splash" aria-hidden="true">
      <div class="ek-s-wrap">
        <span class="ek-s-glow"></span>
        <span class="ek-s-logo"></span>
        <span class="ek-s-mono">E<b>K</b></span>
      </div>
      <div class="ek-s-track"><span></span></div>
    </div>
    <div id="root"></div>
    <noscript>This website requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
